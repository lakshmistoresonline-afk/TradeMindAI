name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: com-webcraft-trademindai-c8f75
  REGION: us-central1
  SERVICE_NAME: trademind-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Install Frontend Dependencies
        run: cd web && npm ci

      - name: Run Backend Tests & Record Evidence
        run: |
          mkdir -p reports/ci_evidence
          pytest backend/tests/unit/ -v > reports/ci_evidence/backend_tests.log 2>&1
          python -c "import json, datetime, hashlib, pathlib; p = pathlib.Path('reports/ci_evidence/backend_tests.log'); sha = hashlib.sha256(p.read_bytes()).hexdigest(); json.dump({'name': 'backend_tests', 'passed': True, 'git_sha': '${{ github.sha }}', 'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'artifact_path': str(p), 'artifact_sha256': sha, 'github_run_id': '${{ github.run_id }}', 'github_run_attempt': '${{ github.run_attempt }}'}, open('reports/ci_evidence/backend_tests.json', 'w'))"

      - name: Run Frontend Lint & Record Evidence
        run: |
          cd web && npm run lint > ../reports/ci_evidence/frontend_lint.log 2>&1
          python -c "import json, datetime, hashlib, pathlib; p = pathlib.Path('reports/ci_evidence/frontend_lint.log'); sha = hashlib.sha256(p.read_bytes()).hexdigest(); json.dump({'name': 'frontend_lint', 'passed': True, 'git_sha': '${{ github.sha }}', 'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'artifact_path': str(p), 'artifact_sha256': sha, 'github_run_id': '${{ github.run_id }}', 'github_run_attempt': '${{ github.run_attempt }}'}, open('reports/ci_evidence/frontend_lint.json', 'w'))"

      - name: Run Frontend Tests & Record Evidence
        run: |
          cd web && npm test > ../reports/ci_evidence/frontend_tests.log 2>&1
          python -c "import json, datetime, hashlib, pathlib; p = pathlib.Path('reports/ci_evidence/frontend_tests.log'); sha = hashlib.sha256(p.read_bytes()).hexdigest(); json.dump({'name': 'frontend_tests', 'passed': True, 'git_sha': '${{ github.sha }}', 'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'artifact_path': str(p), 'artifact_sha256': sha, 'github_run_id': '${{ github.run_id }}', 'github_run_attempt': '${{ github.run_attempt }}'}, open('reports/ci_evidence/frontend_tests.json', 'w'))"

      - name: Run Frontend Build & Record Evidence
        run: |
          cd web && npm run build > ../reports/ci_evidence/frontend_build.log 2>&1
          python -c "import json, datetime, hashlib, pathlib; p = pathlib.Path('reports/ci_evidence/frontend_build.log'); sha = hashlib.sha256(p.read_bytes()).hexdigest(); json.dump({'name': 'frontend_build', 'passed': True, 'git_sha': '${{ github.sha }}', 'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'artifact_path': str(p), 'artifact_sha256': sha, 'github_run_id': '${{ github.run_id }}', 'github_run_attempt': '${{ github.run_attempt }}'}, open('reports/ci_evidence/frontend_build.json', 'w'))"

      - name: Run Mandatory Full CI Release Gate
        run: |
          python scripts/ci_release_gate.py --git-sha "${{ github.sha }}" --github-run-id "${{ github.run_id }}" --github-run-attempt "${{ github.run_attempt }}" --required-evidence "backend_tests,frontend_lint,frontend_tests,frontend_build"

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Container
        run: |-
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} -f backend/Dockerfile .
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }},REDIS_URL=${{ secrets.REDIS_URL }}"
