version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  worker:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - SERVICE_TYPE=worker
      - REDIS_URL=redis://redis:6379/0
      - CELERY_POOL=prefork
      - CELERY_CONCURRENCY=2
    env_file:
      - backend/.env
    depends_on:
      - redis

  beat:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - SERVICE_TYPE=beat
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - backend/.env
    depends_on:
      - redis
