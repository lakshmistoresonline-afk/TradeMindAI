# TradeMindAI Production Nginx Configuration
# Blocks direct static JSON exposure and proxies API requests to FastAPI backend

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # BLOCK DIRECT ACCESS TO STATIC SIGNAL / PERFORMANCE JSON FILES
    location = /signals.json {
        return 404 "Not Found";
    }

    location = /performance.json {
        return 404 "Not Found";
    }

    # PROXY ALL API REQUESTS TO FASTAPI BACKEND
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VITE REACT SPA FALLBACK
    location / {
        try_files $uri $uri/ /index.html;
    }
}
