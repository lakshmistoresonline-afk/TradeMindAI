services:
  # 1. The API Server
  - type: web
    name: trademind-api
    env: docker
    region: singapore
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: com-webcraft-trademindai-c8f75
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # 2. The Background Worker - Added dummy server to prevent Render timeout
  - type: web
    name: trademind-worker
    env: docker
    region: singapore
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: sh -c "python -m celery -A backend.workers.tasks.celery_app worker --loglevel=info -P solo & python3 -m http.server $PORT"
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: com-webcraft-trademindai-c8f75
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # 3. The Scheduler - Added dummy server to prevent Render timeout
  - type: web
    name: trademind-beat
    env: docker
    region: singapore
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: sh -c "python -m celery -A backend.workers.tasks.celery_app beat --loglevel=info & python3 -m http.server $PORT"
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: com-webcraft-trademindai-c8f75
      - key: REDIS_URL
        sync: false
