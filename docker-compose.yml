version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=trademind

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db/trademind
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

# worker:
#   build: ./backend
#   command: celery -A backend.workers.tasks.celery_app worker --loglevel=info
#   environment:
#     - DATABASE_URL=postgresql://user:password@db/trademind
#     - REDIS_URL=redis://redis:6379/0
#   depends_on:
#     - db
#     - redis

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
